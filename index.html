<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🏃 LANE RUNNER</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23252a34'/%3E%3Cpath d='M26 24 L36 24 L34 30 L28 30 Z' fill='%23e4e6eb'/%3E%3Crect x='18' y='34' width='28' height='4' fill='%235a9cff'/%3E%3Crect x='22' y='42' width='20' height='4' fill='%23e04e5f'/%3E%3Ccircle cx='46' cy='40' r='5' fill='%23f5b042'/%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      min-height: 100vh;
      background: #1a1e26;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 12px;
    }
    .main-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 16px;
      max-width: 1100px;
      width: 100%;
    }
    .game-card {
      flex: 0 1 auto;
      min-width: 300px;
      max-width: 460px;
      width: 100%;
      background: #252a34;
      border-radius: 28px;
      padding: 18px 18px 22px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
    }
    .leaderboard-panel {
      flex: 1 1 260px;
      max-width: 320px;
      min-width: 240px;
      background: #252a34;
      border-radius: 28px;
      padding: 18px 14px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      color: #e4e6eb;
      max-height: 620px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .leaderboard-panel h2 {
      text-align: center;
      margin-bottom: 12px;
      font-weight: 500;
      color: #ffffff;
    }
    .leaderboard-scroll {
      overflow-y: auto;
      flex: 1;
      border-radius: 16px;
      background: #1a1e26;
      padding: 6px 4px;
    }
    .leaderboard-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid #3a4050;
      color: #d0d4dd;
      font-size: 0.9rem;
    }
    .leaderboard-row.header {
      font-weight: 600;
      color: #ffffff;
      border-bottom: 2px solid #5a6275;
      position: sticky;
      top: 0;
      background: #1a1e26;
    }
    .leaderboard-row.highlight {
      background: #2a3a5a;
      border-radius: 12px;
      margin: 4px 0;
      font-weight: 600;
      color: #ffd966;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
      align-items: center;
    }
    .stat {
      background: #1e232c;
      padding: 8px 14px;
      border-radius: 40px;
      color: #e4e6eb;
      font-weight: 500;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: inset 0 1px 2px #00000030;
    }
    .stat span {
      color: #ffffff;
      font-weight: 600;
      min-width: 2rem;
      text-align: right;
    }
    .nickname-edit {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .edit-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 4px;
      color: #a8b1c4;
      transition: 0.1s;
    }
    .edit-btn:active {
      transform: scale(0.9);
      color: #ffffff;
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 400 / 500;
      border-radius: 24px;
      background: #12161c;
      box-shadow: inset 0 0 0 1px #3e4555, 0 6px 12px rgba(0,0,0,0.3);
      touch-action: none;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .action-area {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      background: #3a4458;
      border: none;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 500;
      padding: 10px 22px;
      border-radius: 60px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: 0.1s;
      letter-spacing: 0.3px;
    }
    .btn:active {
      background: #4e5a72;
      transform: scale(0.97);
    }
    .hint {
      color: #a8b1c4;
      text-align: center;
      font-weight: 400;
      font-size: 0.8rem;
      margin-top: 10px;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      visibility: hidden;
    }
    .modal.active {
      visibility: visible;
    }
    .modal-content {
      background: #2f3646;
      border-radius: 32px;
      padding: 28px 24px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      color: #ffffff;
      text-align: center;
    }
    .modal-content input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 60px;
      border: 1px solid #5a6275;
      background: #1e232c;
      color: white;
      font-size: 1rem;
      outline: none;
      margin-bottom: 20px;
    }
    .modal-content button {
      background: #4e5a72;
      border: none;
      color: white;
      font-weight: 500;
      padding: 10px 24px;
      border-radius: 60px;
      font-size: 0.9rem;
      cursor: pointer;
      margin: 5px;
    }
    /* Стили для панели настроек */
    .settings-panel {
      text-align: left;
    }
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
    }
    .setting-item label {
      font-size: 1rem;
    }
    .toggle-switch {
      width: 50px;
      height: 24px;
      background: #3a4458;
      border-radius: 30px;
      position: relative;
      cursor: pointer;
      transition: 0.2s;
    }
    .toggle-switch.active {
      background: #5a9cff;
    }
    .toggle-switch::after {
      content: '';
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 4px;
      transition: 0.2s;
    }
    .toggle-switch.active::after {
      left: 26px;
    }
    .slider {
      width: 140px;
      cursor: pointer;
      background: #3a4458;
      height: 4px;
      border-radius: 2px;
      -webkit-appearance: none;
    }
    .slider:focus {
      outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #5a9cff;
      cursor: pointer;
    }
    @media (max-width: 700px) {
      .main-wrapper {
        flex-direction: column;
        align-items: center;
      }
      .leaderboard-panel {
        max-width: 100%;
        width: 100%;
        max-height: 280px;
      }
    }
  </style>
</head>
<body>

<!-- Модальное окно для первого ввода ника -->
<div class="modal" id="nicknameModal">
  <div class="modal-content">
    <h2>🏃 Введите ваш ник</h2>
    <input type="text" id="nicknameInput" maxlength="16" placeholder="Ваше имя">
    <br>
    <button id="saveNicknameBtn">Сохранить</button>
    <button id="randomNicknameBtn">🎲 Случайный</button>
  </div>
</div>

<!-- Модальное окно для редактирования ника -->
<div class="modal" id="editNicknameModal">
  <div class="modal-content">
    <h2>✏️ Редактировать ник</h2>
    <input type="text" id="editNicknameInput" maxlength="16" placeholder="Новый ник">
    <br>
    <button id="saveEditNicknameBtn">Сохранить</button>
    <button id="randomEditNicknameBtn">🎲 Случайный</button>
    <button id="cancelEditBtn">Отмена</button>
  </div>
</div>

<!-- Модальное окно настроек -->
<div class="modal" id="settingsModal">
  <div class="modal-content settings-panel">
    <h2>⚙️ Настройки</h2>
    <div class="setting-item">
      <label>🎵 Музыка</label>
      <div id="musicToggle" class="toggle-switch"></div>
    </div>
    <div class="setting-item">
      <label>🔊 Звуковые эффекты</label>
      <div id="sfxToggle" class="toggle-switch"></div>
    </div>
    <div class="setting-item">
      <label>🎚️ Громкость музыки</label>
      <input type="range" id="musicVolumeSlider" class="slider" min="0" max="100" step="1" value="30">
    </div>
    <div class="setting-item">
      <label>🔊 Громкость эффектов</label>
      <input type="range" id="sfxVolumeSlider" class="slider" min="0" max="100" step="1" value="40">
    </div>
    <button id="closeSettingsBtn">Закрыть</button>
  </div>
</div>

<div class="main-wrapper">
  <div class="game-card">
    <div class="stats">
      <div class="stat">🏆 <span id="scoreDisplay">0</span></div>
      <div class="stat">📊 <span id="bestDisplay">0</span></div>
      <div class="stat nickname-edit">
        👤 <span id="nicknameDisplaySpan">---</span>
        <button class="edit-btn" id="editNicknameBtn">✏️</button>
      </div>
    </div>

    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <div class="action-area">
      <button class="btn" id="restartBtn">▶ СТАРТ</button>
      <button class="btn" id="settingsBtn">⚙️ Настройки</button>
    </div>
    <div class="hint">
      🚀 ПРОБЕЛ / ТАП / КЛИК — прыжок между линиями
    </div>
  </div>

  <div class="leaderboard-panel">
    <h2>🏅 ТОП-100 раннеров</h2>
    <div class="leaderboard-scroll">
      <div class="leaderboard-row header"><span>Игрок</span><span>Счёт</span></div>
      <div id="leaderboardBody">Загрузка...</div>
    </div>
    <div id="myRankInfo" style="margin-top: 8px; font-size: 0.8rem; text-align: center; color: #aaa;"></div>
  </div>
</div>

<script type="module">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
  import { getDatabase, ref, onValue, set, get, query, orderByChild, limitToLast } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js';
  import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';

  // ---------- FIREBASE ----------
  const firebaseConfig = {
    apiKey: "AIzaSyDNYKNYBi0aesICjdJ07aEtd3IF3u--e4w",
    authDomain: "game-c4139.firebaseapp.com",
    databaseURL: "https://game-c4139-default-rtdb.firebaseio.com",
    projectId: "game-c4139",
    storageBucket: "game-c4139.firebasestorage.app",
    messagingSenderId: "64251175324",
    appId: "1:64251175324:web:dbbf6423241f42f22ca859"
  };

  const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  signInAnonymously(auth).catch(e => console.warn('Auth:', e));
  const LEADERBOARD_PATH = 'lane_runner_leaderboard';
  const leaderboardRef = ref(db, LEADERBOARD_PATH);

  // ---------- НИКНЕЙМ ----------
  let playerNickname = localStorage.getItem('laneRunnerNickname');
  const nicknameSpan = document.getElementById('nicknameDisplaySpan');
  const modalFirst = document.getElementById('nicknameModal');
  const editModal = document.getElementById('editNicknameModal');
  const editInput = document.getElementById('editNicknameInput');
  let gameAllowed = false;

  function generateRandomNick() {
    const adj = ['Swift', 'Quick', 'Sharp', 'Bold', 'Calm', 'Brave', 'Fast', 'Lucky', 'Steel', 'Wild'];
    const noun = ['Fox', 'Hawk', 'Wolf', 'Lynx', 'Falcon', 'Runner', 'Dash', 'Puma', 'Tiger', 'Eagle'];
    return `${adj[Math.floor(Math.random() * adj.length)]}_${noun[Math.floor(Math.random() * noun.length)]}${Math.floor(Math.random()*100)}`;
  }

  function applyNickname(name) {
    playerNickname = name || generateRandomNick();
    localStorage.setItem('laneRunnerNickname', playerNickname);
    nicknameSpan.textContent = playerNickname;
    gameAllowed = true;
  }

  if (!playerNickname) {
    modalFirst.classList.add('active');
    gameAllowed = false;
  } else {
    nicknameSpan.textContent = playerNickname;
    gameAllowed = true;
  }

  document.getElementById('saveNicknameBtn').addEventListener('click', () => {
    const newName = document.getElementById('nicknameInput').value.trim();
    if (newName) applyNickname(newName);
    else applyNickname(generateRandomNick());
    modalFirst.classList.remove('active');
  });
  document.getElementById('randomNicknameBtn').addEventListener('click', () => {
    applyNickname(generateRandomNick());
    modalFirst.classList.remove('active');
  });
  document.getElementById('editNicknameBtn').addEventListener('click', () => {
    if (!gameAllowed) return;
    editInput.value = playerNickname;
    editModal.classList.add('active');
  });
  document.getElementById('saveEditNicknameBtn').addEventListener('click', () => {
    const newName = editInput.value.trim();
    if (newName) applyNickname(newName);
    else applyNickname(generateRandomNick());
    editModal.classList.remove('active');
  });
  document.getElementById('randomEditNicknameBtn').addEventListener('click', () => {
    applyNickname(generateRandomNick());
    editModal.classList.remove('active');
  });
  document.getElementById('cancelEditBtn').addEventListener('click', () => {
    editModal.classList.remove('active');
  });
  editInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      const newName = editInput.value.trim();
      if (newName) applyNickname(newName);
      else applyNickname(generateRandomNick());
      editModal.classList.remove('active');
    }
  });

  // ---------- ТАБЛИЦА ЛИДЕРОВ ----------
  const leaderboardBody = document.getElementById('leaderboardBody');
  const myRankInfo = document.getElementById('myRankInfo');
  const topScoresQuery = query(leaderboardRef, orderByChild('score'), limitToLast(100));
  let leaderboardData = [];

  onValue(topScoresQuery, (snapshot) => {
    const entries = [];
    snapshot.forEach(child => {
      const data = child.val();
      if (data && typeof data.score === 'number') {
        entries.push({ nickname: data.nickname || '???', score: data.score, key: child.key });
      }
    });
    entries.sort((a, b) => b.score - a.score);
    leaderboardData = entries;
    let html = '';
    let myRank = null;
    entries.forEach((entry, idx) => {
      const rank = idx+1;
      const isMe = (entry.nickname === playerNickname);
      if (isMe) myRank = rank;
      html += `<div class="leaderboard-row ${isMe ? 'highlight' : ''}"><span>${rank}. ${escapeHtml(entry.nickname)}</span><span>${entry.score}</span></div>`;
    });
    if (entries.length === 0) html = '<div class="leaderboard-row">🏁 Пока нет рекордов</div>';
    leaderboardBody.innerHTML = html;
    if (myRank) myRankInfo.innerText = `🏆 Ваше место: ${myRank} из ${entries.length}`;
    else myRankInfo.innerText = playerNickname ? `📊 Ваш рекорд не в топ-100` : '';
  }, (error) => {
    console.error(error);
    leaderboardBody.innerHTML = '<div class="leaderboard-row">⚠️ Ошибка загрузки</div>';
  });

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // ---------- НАСТРОЙКИ ЗВУКА И МУЗЫКИ ----------
  // Параметры музыки
  const GAME_MUSIC_PATH = './game_music/';
  const MENU_MUSIC_PATH = './menu_music/';
  let gameTrackCount = 4;
  let menuTrackCount = 4;

  let currentMusic = null;
  let currentMusicType = null;
  let isMusicPlaying = false;
  let lastGameTrackIndex = -1;
  let lastMenuTrackIndex = -1;

  // Настройки из localStorage
  let musicEnabled = localStorage.getItem('laneRunnerMusicEnabled') !== 'false';
  let sfxEnabled = localStorage.getItem('laneRunnerSfxEnabled') !== 'false';
  let musicVolume = parseInt(localStorage.getItem('laneRunnerMusicVolume') || '30', 10);
  let sfxVolume = parseInt(localStorage.getItem('laneRunnerSfxVolume') || '40', 10);

  // Элементы управления настройками
  const settingsModal = document.getElementById('settingsModal');
  const settingsBtn = document.getElementById('settingsBtn');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');
  const musicToggle = document.getElementById('musicToggle');
  const sfxToggle = document.getElementById('sfxToggle');
  const musicVolumeSlider = document.getElementById('musicVolumeSlider');
  const sfxVolumeSlider = document.getElementById('sfxVolumeSlider');

  function updateMusicToggleUI() {
    if (musicEnabled) musicToggle.classList.add('active');
    else musicToggle.classList.remove('active');
  }
  function updateSfxToggleUI() {
    if (sfxEnabled) sfxToggle.classList.add('active');
    else sfxToggle.classList.remove('active');
  }
  musicVolumeSlider.value = musicVolume;
  sfxVolumeSlider.value = sfxVolume;

  // Сохраняем настройки
  function saveSettings() {
    localStorage.setItem('laneRunnerMusicEnabled', musicEnabled);
    localStorage.setItem('laneRunnerSfxEnabled', sfxEnabled);
    localStorage.setItem('laneRunnerMusicVolume', musicVolume);
    localStorage.setItem('laneRunnerSfxVolume', sfxVolume);
    if (currentMusic) currentMusic.volume = musicVolume / 100;
  }

  // Музыкальные функции
  function getRandomTrackIndex(total, lastIndex) {
    if (total <= 1) return 0;
    let newIndex = Math.floor(Math.random() * total);
    while (newIndex === lastIndex) {
      newIndex = Math.floor(Math.random() * total);
    }
    return newIndex;
  }

  function playMusic(type) {
    if (!musicEnabled) return;
    if (currentMusic) {
      currentMusic.pause();
      currentMusic.src = '';
      currentMusic = null;
    }
    let trackCount = (type === 'game') ? gameTrackCount : menuTrackCount;
    if (trackCount === 0) return;
    let lastIndex = (type === 'game') ? lastGameTrackIndex : lastMenuTrackIndex;
    let newIndex = getRandomTrackIndex(trackCount, lastIndex);
    if (type === 'game') lastGameTrackIndex = newIndex;
    else lastMenuTrackIndex = newIndex;
    const trackNumber = newIndex + 1;
    const musicUrl = (type === 'game') 
      ? `${GAME_MUSIC_PATH}${trackNumber}.ogg`
      : `${MENU_MUSIC_PATH}${trackNumber}.ogg`;
    currentMusic = new Audio(musicUrl);
    currentMusic.loop = false;
    currentMusic.volume = musicVolume / 100;
    currentMusic.play().catch(e => console.log(`Music play error: ${musicUrl}`, e));
    isMusicPlaying = true;
    currentMusicType = type;
    currentMusic.onended = () => {
      if (musicEnabled && isMusicPlaying && currentMusicType === type) {
        playMusic(type);
      }
    };
  }

  function stopMusic() {
    if (currentMusic) {
      currentMusic.pause();
      currentMusic.src = '';
      currentMusic = null;
    }
    isMusicPlaying = false;
    currentMusicType = null;
  }

  function startGameMusic() {
    if (!musicEnabled) return;
    if (currentMusicType !== 'game') {
      stopMusic();
    }
    playMusic('game');
  }

  function startMenuMusic() {
    if (!musicEnabled) return;
    if (currentMusicType !== 'menu') {
      stopMusic();
    }
    playMusic('menu');
  }

  // Звуковые эффекты (Web Audio)
  let audioCtx = null;
  let masterGain = null; // для громкости эффектов

  function initAudioEffects() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = sfxVolume / 100;
    masterGain.connect(audioCtx.destination);
  }

  function playJumpSound() {
    if (!sfxEnabled || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(masterGain);
    osc.frequency.value = 880;
    gain.gain.value = 0.2;
    osc.type = 'sine';
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
    osc.stop(audioCtx.currentTime + 0.2);
  }

  function playScoreSound() {
    if (!sfxEnabled || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(masterGain);
    osc.frequency.value = 660;
    gain.gain.value = 0.15;
    osc.type = 'triangle';
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
    osc.stop(audioCtx.currentTime + 0.15);
  }

  function playCrashSound() {
    if (!sfxEnabled || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(masterGain);
    osc.frequency.value = 220;
    gain.gain.value = 0.3;
    osc.type = 'sawtooth';
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
    osc.stop(audioCtx.currentTime + 0.3);
  }

  // Обновление громкости эффектов при изменении слайдера
  function updateSfxVolume() {
    if (masterGain) masterGain.gain.value = sfxVolume / 100;
  }

  // Обработчики настроек
  musicToggle.addEventListener('click', () => {
    musicEnabled = !musicEnabled;
    updateMusicToggleUI();
    saveSettings();
    if (musicEnabled) {
      if (gameActive) startGameMusic();
      else startMenuMusic();
    } else {
      stopMusic();
    }
  });
  sfxToggle.addEventListener('click', () => {
    sfxEnabled = !sfxEnabled;
    updateSfxToggleUI();
    saveSettings();
    // если звук отключили, не нужно ничего чистить, просто перестанут играть эффекты
  });
  musicVolumeSlider.addEventListener('input', (e) => {
    musicVolume = parseInt(e.target.value, 10);
    saveSettings();
    if (currentMusic) currentMusic.volume = musicVolume / 100;
  });
  sfxVolumeSlider.addEventListener('input', (e) => {
    sfxVolume = parseInt(e.target.value, 10);
    saveSettings();
    updateSfxVolume();
  });
  settingsBtn.addEventListener('click', () => {
    settingsModal.classList.add('active');
  });
  closeSettingsBtn.addEventListener('click', () => {
    settingsModal.classList.remove('active');
  });
  updateMusicToggleUI();
  updateSfxToggleUI();

  // Разрешение аудио по жесту
  function enableAudioOnUserGesture() {
    if (!audioCtx) {
      initAudioEffects();
      audioCtx.resume().catch(e=>console.log);
    }
    if (musicEnabled) {
      if (gameActive && currentMusicType !== 'game') {
        startGameMusic();
      } else if (!gameActive && currentMusicType !== 'menu') {
        startMenuMusic();
      }
    }
  }

  // ---------- ИГРОВАЯ ЛОГИКА ----------
  const LANE_COUNT = 3;
  const PLAYER_SIZE = 36;
  const OBSTACLE_SIZE = 40;
  const BASE_SPEED = 4.6;
  const MAX_SPEED = 12;
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreSpan = document.getElementById('scoreDisplay');
  const bestSpan = document.getElementById('bestDisplay');
  
  let player = { lane: 1, yOffset: 0 };
  let obstacles = [];
  let score = 0;
  let bestScore = 0;
  let gameActive = false;
  let frameRequest;
  let speed = BASE_SPEED;
  let particles = [];
  let floatTexts = [];
  let cameraShake = 0;
  let shakeTimeout = null;
  
  try { const saved = localStorage.getItem('laneRunner_best'); if (saved) bestScore = parseInt(saved,10)||0; } catch(e) {}
  bestSpan.textContent = bestScore;
  
  function startShake(intensity) {
    if (shakeTimeout) clearTimeout(shakeTimeout);
    cameraShake = intensity;
    shakeTimeout = setTimeout(() => {
      cameraShake = 0;
      shakeTimeout = null;
    }, 500);
  }
  
  function updateScoreUI() {
    scoreSpan.textContent = score;
    if (score > bestScore) {
      bestScore = score;
      bestSpan.textContent = bestScore;
      localStorage.setItem('laneRunner_best', bestScore);
    }
  }
  
  async function submitScore() {
    if (!playerNickname || score === 0) return;
    try {
      const safeKey = encodeURIComponent(playerNickname);
      const playerRef = ref(db, `${LEADERBOARD_PATH}/${safeKey}`);
      const snapshot = await get(playerRef);
      const currentData = snapshot.val();
      if (!currentData || score > currentData.score) {
        await set(playerRef, { nickname: playerNickname, score: score, timestamp: Date.now() });
        console.log(`🏅 Рекорд обновлён: ${playerNickname} → ${score}`);
      }
    } catch(e) { console.error(e); }
  }
  
  function spawnObstacle() {
    obstacles.push({ lane: Math.floor(Math.random() * LANE_COUNT), y: -OBSTACLE_SIZE, w: OBSTACLE_SIZE, h: OBSTACLE_SIZE });
  }
  
  function addParticles(x, y) {
    for (let i=0; i<12; i++) {
      particles.push({ x: x+Math.random()*30, y: y+Math.random()*30, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6-2, life: 0.6 });
    }
  }
  
  function addFloatScore(value, x, y) {
    floatTexts.push({ text: `+${value}`, x: x, y: y, life: 1 });
  }
  
  function resetGame() {
    if (!gameAllowed) return;
    enableAudioOnUserGesture();
    player.lane = 1;
    obstacles = [];
    score = 0;
    speed = BASE_SPEED;
    particles = [];
    floatTexts = [];
    gameActive = true;
    if (shakeTimeout) clearTimeout(shakeTimeout);
    cameraShake = 0;
    updateScoreUI();
    spawnObstacle();
    if (musicEnabled) startGameMusic();
    if (frameRequest) cancelAnimationFrame(frameRequest);
    frameRequest = requestAnimationFrame(gameLoop);
  }
  
  function jump() {
    if (!gameAllowed) return;
    if (!gameActive) { resetGame(); return; }
    if (sfxEnabled) playJumpSound();
    player.lane = (player.lane + 1) % LANE_COUNT;
    player.yOffset = -8;
    setTimeout(() => { player.yOffset = 0; }, 100);
  }
  
  function gameLoop() {
    if (!gameActive) { draw(); frameRequest = requestAnimationFrame(gameLoop); return; }
    
    for (let i=0; i<particles.length; i++) {
      particles[i].x += particles[i].vx;
      particles[i].y += particles[i].vy;
      particles[i].life -= 0.02;
      particles[i].vy += 0.2;
      if (particles[i].life <= 0) particles.splice(i--,1);
    }
    for (let i=0; i<floatTexts.length; i++) {
      floatTexts[i].life -= 0.02;
      floatTexts[i].y -= 1.2;
      if (floatTexts[i].life <= 0) floatTexts.splice(i--,1);
    }
    
    for (let obs of obstacles) obs.y += speed;
    obstacles = obstacles.filter(obs => {
      if (obs.y > canvas.height + 100) {
        score++;
        updateScoreUI();
        if (sfxEnabled) playScoreSound();
        addFloatScore(1, canvas.width-60, 40);
        speed = Math.min(MAX_SPEED, BASE_SPEED + Math.floor(score / 7) * 1.2);
        return false;
      }
      return true;
    });
    
    if (obstacles.length === 0 || obstacles[obstacles.length-1].y > 200) spawnObstacle();
    
    const laneW = canvas.width / LANE_COUNT;
    const px = player.lane * laneW + (laneW - PLAYER_SIZE)/2;
    const py = 440 + player.yOffset;
    const prect = { x: px, y: py - PLAYER_SIZE/2, w: PLAYER_SIZE, h: PLAYER_SIZE };
    
    for (let obs of obstacles) {
      const ox = obs.lane * laneW + (laneW - obs.w)/2;
      if (prect.x < ox + obs.w && prect.x + prect.w > ox &&
          prect.y < obs.y + obs.h && prect.y + prect.h > obs.y) {
        gameActive = false;
        if (sfxEnabled) playCrashSound();
        addParticles(px+PLAYER_SIZE/2, py);
        startShake(8);
        stopMusic();
        if (musicEnabled) startMenuMusic();
        if (playerNickname) submitScore();
        break;
      }
    }
    draw();
    frameRequest = requestAnimationFrame(gameLoop);
  }
  
  function draw() {
    ctx.save();
    if (cameraShake > 0) {
      ctx.translate((Math.random()-0.5)*cameraShake, (Math.random()-0.5)*cameraShake*0.6);
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#12161c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#3e4555';
    ctx.lineWidth = 2;
    for (let i=1; i<LANE_COUNT; i++) {
      const x = i * canvas.width / LANE_COUNT;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
    const laneW = canvas.width / LANE_COUNT;
    ctx.shadowBlur = 6;
    for (let obs of obstacles) {
      const x = obs.lane * laneW + (laneW - obs.w)/2;
      ctx.fillStyle = '#e04e5f';
      ctx.fillRect(x, obs.y, obs.w, obs.h);
      ctx.fillStyle = '#f07a89';
      ctx.fillRect(x+4, obs.y+4, obs.w/3, obs.h/5);
    }
    const px = player.lane * laneW + (laneW - PLAYER_SIZE)/2;
    const py = 440 + player.yOffset;
    ctx.fillStyle = '#5a9cff';
    ctx.shadowBlur = 8;
    ctx.fillRect(px, py - PLAYER_SIZE/2, PLAYER_SIZE, PLAYER_SIZE);
    ctx.fillStyle = '#a0c4ff';
    ctx.fillRect(px+6, py - PLAYER_SIZE/2+6, PLAYER_SIZE/3, PLAYER_SIZE/5);
    for (let p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = '#ffaa66';
      ctx.fillRect(p.x, p.y, 4, 4);
    }
    ctx.globalAlpha = 1;
    for (let t of floatTexts) {
      ctx.font = 'bold 20px Inter';
      ctx.fillStyle = `rgba(255, 220, 100, ${t.life})`;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.shadowBlur = 0;
    if (!gameActive) {
      ctx.font = 'bold 24px Inter, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 10;
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2-15);
      ctx.font = '16px Inter';
      ctx.fillText('Нажми СТАРТ', canvas.width/2, canvas.height/2+20);
    }
    ctx.font = 'bold 22px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`${score}`, canvas.width-50, 45);
    ctx.textAlign = 'left';
    ctx.restore();
  }
  
  // Управление
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && gameAllowed) {
      e.preventDefault();
      jump();
      enableAudioOnUserGesture();
    }
  });
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); if(gameAllowed) { jump(); enableAudioOnUserGesture(); } }, { passive: false });
  canvas.addEventListener('mousedown', (e) => { e.preventDefault(); if(gameAllowed) { jump(); enableAudioOnUserGesture(); } });
  document.getElementById('restartBtn').addEventListener('click', () => { resetGame(); enableAudioOnUserGesture(); });
  
  function idleDraw() { draw(); requestAnimationFrame(idleDraw); }
  idleDraw();
  
  initAudioEffects();
  console.log('🏃 LANE RUNNER — с настройками звука. Папки: game_music, menu_music с файлами 1.ogg,2.ogg...');
</script>
</body>
</html>
