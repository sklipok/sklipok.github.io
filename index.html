<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🏃 LANE RUNNER · Мировой рейтинг</title>
  <!-- Фавикон в стиле раннера (бегун + дорожки) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23252a34'/%3E%3Cpath d='M26 24 L36 24 L34 30 L28 30 Z' fill='%23e4e6eb'/%3E%3Crect x='18' y='34' width='28' height='4' fill='%235a9cff'/%3E%3Crect x='22' y='42' width='20' height='4' fill='%23e04e5f'/%3E%3Ccircle cx='46' cy='40' r='5' fill='%23f5b042'/%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #1a1e26;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 12px;
    }

    .main-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 16px;
      max-width: 1100px;
      width: 100%;
    }

    .game-card {
      flex: 0 1 auto;
      min-width: 300px;
      max-width: 460px;
      width: 100%;
      background: #252a34;
      border-radius: 28px;
      padding: 18px 18px 22px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
    }

    .leaderboard-panel {
      flex: 1 1 260px;
      max-width: 320px;
      min-width: 240px;
      background: #252a34;
      border-radius: 28px;
      padding: 18px 14px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      color: #e4e6eb;
      max-height: 620px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .leaderboard-panel h2 {
      text-align: center;
      margin-bottom: 12px;
      font-weight: 500;
      color: #ffffff;
    }

    .leaderboard-scroll {
      overflow-y: auto;
      flex: 1;
      border-radius: 16px;
      background: #1a1e26;
      padding: 6px 4px;
    }

    .leaderboard-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid #3a4050;
      color: #d0d4dd;
      font-size: 0.95rem;
    }
    .leaderboard-row.header {
      font-weight: 600;
      color: #ffffff;
      border-bottom: 2px solid #5a6275;
      position: sticky;
      top: 0;
      background: #1a1e26;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }

    .stat {
      background: #1e232c;
      padding: 8px 14px;
      border-radius: 40px;
      color: #e4e6eb;
      font-weight: 500;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: inset 0 1px 2px #00000030;
    }

    .stat span {
      color: #ffffff;
      font-weight: 600;
      min-width: 2rem;
      text-align: right;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 400 / 500;
      border-radius: 24px;
      background: #12161c;
      box-shadow: inset 0 0 0 1px #3e4555, 0 6px 12px rgba(0,0,0,0.3);
      touch-action: none;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .action-area {
      display: flex;
      justify-content: center;
    }

    .btn {
      background: #3a4458;
      border: none;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 500;
      padding: 12px 28px;
      border-radius: 60px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: 0.15s;
      letter-spacing: 0.3px;
    }

    .btn:active {
      background: #4e5a72;
      transform: scale(0.97);
    }

    .hint {
      color: #a8b1c4;
      text-align: center;
      font-weight: 400;
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      visibility: hidden;
    }
    .modal.active {
      visibility: visible;
    }
    .modal-content {
      background: #2f3646;
      border-radius: 32px;
      padding: 28px 24px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      color: #ffffff;
      text-align: center;
    }
    .modal-content h2 {
      margin-bottom: 20px;
      font-weight: 500;
    }
    .modal-content input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 60px;
      border: 1px solid #5a6275;
      background: #1e232c;
      color: white;
      font-size: 1rem;
      outline: none;
      margin-bottom: 20px;
    }
    .modal-content button {
      background: #4e5a72;
      border: none;
      color: white;
      font-weight: 500;
      padding: 12px 28px;
      border-radius: 60px;
      font-size: 1rem;
      cursor: pointer;
      margin: 5px;
    }

    @media (max-width: 700px) {
      .main-wrapper {
        flex-direction: column;
        align-items: center;
      }
      .leaderboard-panel {
        max-width: 100%;
        width: 100%;
        max-height: 260px;
      }
      .game-card {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="modal" id="nicknameModal">
  <div class="modal-content">
    <h2>🏃 Введите ваш ник</h2>
    <input type="text" id="nicknameInput" maxlength="16" placeholder="Ваше имя">
    <br>
    <button id="saveNicknameBtn">Сохранить</button>
    <button id="randomNicknameBtn">🎲 Случайный</button>
  </div>
</div>

<div class="main-wrapper">
  <div class="game-card">
    <div class="stats">
      <div class="stat">🏆 <span id="scoreDisplay">0</span></div>
      <div class="stat">📊 <span id="bestDisplay">0</span></div>
      <div class="stat" id="nicknameDisplay">👤 <span>---</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <div class="action-area">
      <button class="btn" id="restartBtn">▶ СТАРТ</button>
    </div>
    <div class="hint">
      🚀 ПРОБЕЛ или ТАП — прыжок между линиями
    </div>
  </div>

  <div class="leaderboard-panel">
    <h2>🏅 ТОП-100 раннеров</h2>
    <div class="leaderboard-scroll">
      <div class="leaderboard-row header"><span>Игрок</span><span>Счёт</span></div>
      <div id="leaderboardBody">Загрузка...</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
  import { getDatabase, ref, onValue, set, get, query, orderByChild, limitToLast } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js';
  import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDNYKNYBi0aesICjdJ07aEtd3IF3u--e4w",
    authDomain: "game-c4139.firebaseapp.com",
    databaseURL: "https://game-c4139-default-rtdb.firebaseio.com",
    projectId: "game-c4139",
    storageBucket: "game-c4139.firebasestorage.app",
    messagingSenderId: "64251175324",
    appId: "1:64251175324:web:dbbf6423241f42f22ca859"
  };

  const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  signInAnonymously(auth).catch(e => console.warn('Auth:', e));

  // ИСПРАВЛЕНО: используем отдельную ветку lane_runner_leaderboard (согласно правилам)
  const LEADERBOARD_PATH = 'lane_runner_leaderboard';
  const leaderboardRef = ref(db, LEADERBOARD_PATH);

  // ---------- НИКНЕЙМ ----------
  let playerNickname = localStorage.getItem('laneRunnerNickname');
  const nicknameSpan = document.querySelector('#nicknameDisplay span');
  const modal = document.getElementById('nicknameModal');
  const input = document.getElementById('nicknameInput');
  
  let gameAllowed = false;

  function generateRandomNick() {
    const adj = ['Swift', 'Quick', 'Sharp', 'Bold', 'Calm', 'Brave', 'Fast', 'Lucky', 'Steel', 'Wild'];
    const noun = ['Fox', 'Hawk', 'Wolf', 'Lynx', 'Falcon', 'Runner', 'Dash', 'Puma', 'Tiger', 'Eagle'];
    const a = adj[Math.floor(Math.random() * adj.length)];
    const n = noun[Math.floor(Math.random() * noun.length)];
    return `${a}_${n}${Math.floor(Math.random()*100)}`;
  }

  function saveNickname(name) {
    playerNickname = name || generateRandomNick();
    localStorage.setItem('laneRunnerNickname', playerNickname);
    nicknameSpan.textContent = playerNickname;
    modal.classList.remove('active');
    gameAllowed = true;
  }

  if (!playerNickname) {
    modal.classList.add('active');
    gameAllowed = false;
  } else {
    nicknameSpan.textContent = playerNickname;
    gameAllowed = true;
  }

  document.getElementById('saveNicknameBtn').addEventListener('click', () => saveNickname(input.value.trim()));
  document.getElementById('randomNicknameBtn').addEventListener('click', () => saveNickname(generateRandomNick()));
  input.addEventListener('keypress', (e) => { if(e.key==='Enter') saveNickname(input.value.trim()); });

  // ---------- ТАБЛИЦА ЛИДЕРОВ (сортировка по score, топ-100) ----------
  const leaderboardBody = document.getElementById('leaderboardBody');
  
  // Оптимизированный запрос с использованием индекса score (согласно правилам)
  const topScoresQuery = query(leaderboardRef, orderByChild('score'), limitToLast(100));

  onValue(topScoresQuery, (snapshot) => {
    const entries = [];
    snapshot.forEach(child => {
      const data = child.val();
      if (data && typeof data.score === 'number') {
        entries.push({ 
          nickname: data.nickname || '???', 
          score: data.score,
          key: child.key 
        });
      }
    });
    
    // Сортируем по убыванию (limitToLast даёт последние 100 по возрастанию, поэтому переворачиваем)
    entries.sort((a, b) => b.score - a.score);
    
    let html = '';
    entries.forEach((entry, index) => {
      html += `<div class="leaderboard-row"><span>${index+1}. ${escapeHtml(entry.nickname)}</span><span>${entry.score}</span></div>`;
    });
    
    if (entries.length === 0) {
      html = '<div class="leaderboard-row">🏁 Пока нет рекордов</div>';
    }
    
    leaderboardBody.innerHTML = html;
    console.log(`📋 Таблица обновлена, записей: ${entries.length}`);
  }, (error) => {
    console.error('Ошибка загрузки таблицы:', error);
    leaderboardBody.innerHTML = '<div class="leaderboard-row">⚠️ Ошибка загрузки</div>';
  });

  // Простая защита от XSS
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // ---------- ИГРА ----------
  const LANE_COUNT = 3;
  const PLAYER_SIZE = 36;
  const OBSTACLE_SIZE = 40;
  const BASE_SPEED = 4.6;
  const MAX_SPEED = 12;
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreSpan = document.getElementById('scoreDisplay');
  const bestSpan = document.getElementById('bestDisplay');
  
  let player = { lane: 1 };
  let obstacles = [];
  let score = 0;
  let bestScore = 0;
  let gameActive = false;
  let frameRequest;
  let speed = BASE_SPEED;
  
  try {
    const saved = localStorage.getItem('laneRunner_best');
    if (saved) bestScore = parseInt(saved, 10) || 0;
  } catch(e) {}
  bestSpan.textContent = bestScore;
  
  function updateScoreUI() {
    scoreSpan.textContent = score;
    if (score > bestScore) {
      bestScore = score;
      bestSpan.textContent = bestScore;
      try { localStorage.setItem('laneRunner_best', bestScore); } catch(e) {}
    }
  }
  
  async function submitScore() {
    if (!playerNickname) return;
    try {
      // Используем безопасный ключ (ник может содержать спецсимволы)
      const safeKey = encodeURIComponent(playerNickname);
      const playerRef = ref(db, `${LEADERBOARD_PATH}/${safeKey}`);
      
      const snapshot = await get(playerRef);
      const currentData = snapshot.val();
      
      if (!currentData || score > currentData.score) {
        await set(playerRef, {
          nickname: playerNickname,
          score: score,
          timestamp: Date.now()
        });
        console.log(`📤 Рекорд ${!currentData ? 'добавлен' : 'обновлён'}: ${playerNickname} → ${score}`);
      } else {
        console.log(`ℹ️ Результат не улучшен (${score} ≤ ${currentData.score})`);
      }
    } catch(e) {
      console.error('Ошибка отправки:', e);
    }
  }
  
  function spawnObstacle() {
    obstacles.push({
      lane: Math.floor(Math.random() * LANE_COUNT),
      y: -OBSTACLE_SIZE,
      w: OBSTACLE_SIZE,
      h: OBSTACLE_SIZE
    });
  }
  
  function resetGame() {
    if (!gameAllowed) return;
    player.lane = 1;
    obstacles = [];
    score = 0;
    speed = BASE_SPEED;
    gameActive = true;
    updateScoreUI();
    spawnObstacle();
    if (frameRequest) cancelAnimationFrame(frameRequest);
    frameRequest = requestAnimationFrame(gameLoop);
  }
  
  function jump() {
    if (!gameAllowed) return;
    if (!gameActive) { resetGame(); return; }
    player.lane = (player.lane + 1) % LANE_COUNT;
  }
  
  function gameLoop() {
    if (!gameActive) { draw(); frameRequest = requestAnimationFrame(gameLoop); return; }
    
    for (let obs of obstacles) obs.y += speed;
    
    obstacles = obstacles.filter(obs => {
      if (obs.y > canvas.height + 100) {
        score++;
        updateScoreUI();
        speed = Math.min(MAX_SPEED, BASE_SPEED + Math.floor(score / 7) * 1.2);
        return false;
      }
      return true;
    });
    
    if (obstacles.length === 0 || obstacles[obstacles.length-1].y > 200) spawnObstacle();
    
    const laneW = canvas.width / LANE_COUNT;
    const px = player.lane * laneW + (laneW - PLAYER_SIZE)/2;
    const py = 440;
    const prect = { x: px, y: py - PLAYER_SIZE/2, w: PLAYER_SIZE, h: PLAYER_SIZE };
    
    for (let obs of obstacles) {
      const ox = obs.lane * laneW + (laneW - obs.w)/2;
      if (prect.x < ox + obs.w && prect.x + prect.w > ox &&
          prect.y < obs.y + obs.h && prect.y + prect.h > obs.y) {
        gameActive = false;
        if (playerNickname) submitScore();
        break;
      }
    }
    draw();
    frameRequest = requestAnimationFrame(gameLoop);
  }
  
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#12161c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#3e4555';
    ctx.lineWidth = 2;
    for (let i=1; i<LANE_COUNT; i++) {
      const x = i * canvas.width / LANE_COUNT;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
    
    const laneW = canvas.width / LANE_COUNT;
    ctx.shadowColor = '#00000040';
    ctx.shadowBlur = 8;
    for (let obs of obstacles) {
      const x = obs.lane * laneW + (laneW - obs.w)/2;
      ctx.fillStyle = '#e04e5f';
      ctx.fillRect(x, obs.y, obs.w, obs.h);
      ctx.fillStyle = '#f07a89';
      ctx.fillRect(x+3, obs.y+3, obs.w/3, obs.h/5);
    }
    
    const px = player.lane * laneW + (laneW - PLAYER_SIZE)/2;
    const py = 440;
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#5a9cff';
    ctx.fillRect(px, py - PLAYER_SIZE/2, PLAYER_SIZE, PLAYER_SIZE);
    ctx.fillStyle = '#a0c4ff';
    ctx.fillRect(px+5, py - PLAYER_SIZE/2+5, PLAYER_SIZE/3, PLAYER_SIZE/5);
    ctx.shadowBlur = 0;
    
    if (!gameActive) {
      ctx.font = 'bold 24px Inter, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#00000080';
      ctx.shadowBlur = 12;
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2-15);
      ctx.font = '16px Inter, sans-serif';
      ctx.fillText('Нажми СТАРТ', canvas.width/2, canvas.height/2+20);
      ctx.shadowBlur = 0;
    }
    
    ctx.font = 'bold 22px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 8;
    ctx.fillText(`${score}`, canvas.width-60, 45);
    ctx.shadowBlur = 0;
  }
  
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && gameAllowed) {
      e.preventDefault();
      jump();
    }
  });
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); if(gameAllowed) jump(); }, { passive: false });
  canvas.addEventListener('mousedown', (e) => { e.preventDefault(); if(gameAllowed) jump(); });
  document.getElementById('restartBtn').addEventListener('click', resetGame);
  
  function idleDraw() { draw(); requestAnimationFrame(idleDraw); }
  idleDraw();
  
  console.log('🏃 LANE RUNNER — игра готова. Введите ник и нажмите СТАРТ');
  console.log(`📁 Данные сохраняются в Firebase: ${LEADERBOARD_PATH}`);
</script>
</body>
</html>
